<!doctype html>
<html lang="{{ site.lang | escape }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title and page.title != "" %}{{ page.title | escape }}{% if site.title and site.title != "" %} · {% endif %}{% endif %}{{ site.title | escape }}</title>
    {% assign description = page.summary | default: site.description | strip %}
    {% if description != "" %}<meta name="description" content="{{ description | escape }}">{% endif %}
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/mark.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/journal.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="masthead frame">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Home{% if site.title and site.title != '' %}: {{ site.title | escape }}{% endif %}">
        <img src="{{ '/assets/mark.svg' | relative_url }}" alt="" width="32" height="32">
        {% if page.layout != "home" and site.title and site.title != "" %}<span>{{ site.title | escape }}</span>{% endif %}
      </a>
    </header>
    <main id="main" class="frame" tabindex="-1">
      {{ content }}
    </main>
  </body>
</html>
