---
layout: default
---
<article class="article">
  <header class="article-header">
    <time class="dateline" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%d %b %Y" }}</time>
    <h1>{{ page.title | escape }}</h1>
    {% if page.summary and page.summary != "" %}<p class="standfirst">{{ page.summary | escape }}</p>{% endif %}
    {% include tags.html tags=page.tags %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
