title: "tAIx"
description: "Ramblings of an accountant trying to figure out AI"
lang: en-GB

markdown: kramdown
highlighter: rouge
permalink: /posts/:year/:month/:day/:title/
kramdown:
  input: GFM
  auto_ids: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
